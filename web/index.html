<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>经停 Stopover</title>
<meta name="theme-color" content="#02050c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="经停">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%233F5F86%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%224%22 fill=%22%23d8262f%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@400;500&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wdth,wght@125,900&display=swap">
<link rel="stylesheet" href="css/stopover.css?v=1">
<link rel="stylesheet" href="css/binder.css?v=1">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="gHead" cx="35%" cy="30%" r="75%"><stop offset="0" style="stop-color:var(--pin-hi)"/><stop offset=".55" style="stop-color:var(--pin)"/><stop offset="1" style="stop-color:color-mix(in srgb,var(--pin) 55%,#000)"/></radialGradient>
    <radialGradient id="gPin"><stop offset="0" style="stop-color:var(--pin);stop-opacity:.75"/><stop offset=".22" style="stop-color:var(--pin);stop-opacity:.42"/><stop offset=".5" style="stop-color:var(--pin);stop-opacity:.12"/><stop offset="1" style="stop-color:var(--pin);stop-opacity:0"/></radialGradient>
    <radialGradient id="gStar2"><stop offset="0" style="stop-color:var(--star2);stop-opacity:.95"/><stop offset=".35" style="stop-color:var(--star2);stop-opacity:.4"/><stop offset="1" style="stop-color:var(--star2);stop-opacity:0"/></radialGradient>
    <radialGradient id="gStar"><stop offset="0" style="stop-color:var(--star);stop-opacity:.95"/><stop offset=".35" style="stop-color:var(--star);stop-opacity:.4"/><stop offset="1" style="stop-color:var(--star);stop-opacity:0"/></radialGradient>
    <linearGradient id="gNeedle" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#8e949c"/><stop offset="1" stop-color="#e9edf2"/></linearGradient>
  </defs>
</svg>

<div id="globe" aria-label="可拖动的地球"></div>

<header class="top">
  <div class="brand"><h1>经停</h1><span class="stat" id="stat"></span></div>
  <button class="srchbtn" id="srchbtn" aria-label="搜索城市"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m15 15 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>

  <button class="chatbtn" id="chatbtn" aria-label="往来" hidden>往来<i id="chatN" hidden></i></button>
  <button class="bellbtn" id="bellbtn" aria-label="通知" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15L6 16.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 20.5a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  <nav class="styles" id="styles" aria-label="地球风格">
    <button data-s="marble">蓝石</button>
    <button data-s="night">夜航</button>
    <button data-s="paper">旧图</button>
  </nav>
</header>

<aside class="legend">
  <div class="chips">
    <span><svg viewBox="-9 -9 18 18"><circle r="3.4" fill="var(--pin)"/></svg>来过</span>
    <span><svg viewBox="-12 -12 24 24"><circle r="11" fill="url(#gStar)"/><path d="M0-8C.7-1.3 1.3-.7 8 0 1.3.7.7 1.3 0 8-.7 1.3-1.3.7-8 0-1.3-.7-.7-1.3 0-8Z" fill="var(--star)"/></svg><span id="lg-me">我想去</span></span>
    <span><svg viewBox="-12 -12 24 24"><circle r="11" fill="url(#gStar2)"/><path d="M0-8C.7-1.3 1.3-.7 8 0 1.3.7.7 1.3 0 8-.7 1.3-1.3.7-8 0-1.3-.7-.7-1.3 0-8Z" fill="var(--star2)"/></svg><span id="lg-pt">TA想去</span></span>
    <span><svg viewBox="-16 -12 32 24"><path d="M0-8C.7-1.3 1.3-.7 8 0 1.3.7.7 1.3 0 8-.7 1.3-1.3.7-8 0-1.3-.7-.7-1.3 0-8Z" fill="var(--star)" transform="translate(-5,2) scale(.75)"/><path d="M0-8C.7-1.3 1.3-.7 8 0 1.3.7.7 1.3 0 8-.7 1.3-1.3.7-8 0-1.3-.7-.7-1.3 0-8Z" fill="var(--star2)" transform="translate(5,-2) scale(.75)"/></svg>都想去</span>
    <span><svg viewBox="-6 -6 12 12"><circle r="2.6" fill="var(--fg)" opacity=".45"/></svg>有资料的城市</span>
  </div>
  <div class="now" id="now"></div>
  <div class="log"><h3><span>航段</span><span id="total"></span></h3><ol id="log"></ol></div>
</aside>

<article class="card" id="card" aria-live="polite"></article>
<div class="toast" id="toast" hidden></div>
<div class="credit" id="credit"></div>
<button class="dice" id="dice" aria-label="摇骰子，随机选一座城"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8.5" cy="8.5" r="1.4" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.4" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.4" fill="currentColor"/></svg></button>
<div class="dicepop" id="dicepop" hidden><b>从哪里骰？</b><button data-scope="all">所有城市</button><button data-scope="new">没去过的</button><button data-scope="star">想去的星星</button></div>
<div class="ticker" id="ticker" hidden></div>
<div class="layer" id="search" hidden></div>
<div class="layer" id="trip" hidden></div>
<div class="layer" id="lb" hidden></div>
<div class="layer" id="sheet" hidden></div>
<div class="layer" id="chat" hidden></div>

<script src="js/trip.js?v=1"></script>
<script src="js/binder.js?v=1"></script>
<script src="js/inbox.js?v=1"></script>
<script src="js/search.js?v=1"></script>
<script src="js/main.js?v=1"></script>
