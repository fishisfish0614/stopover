<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>经停 Stopover</title>
<meta name="theme-color" content="#02050c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="经停">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%233F5F86%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%224%22 fill=%22%23d8262f%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@400;500&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 布局：地球铺满；选中城市后地球放大并描出城市轮廓。宽屏卡片从左侧展开（地球右移让位），竖屏从底部升起，上滑拉满。
   卡片是一张杂志内页：报头 / 大字城名 / 题图 / 历史（首字下沉）/ 引语 / 文化 / 景点特写 / 美食菜单。三种地球风格各配一种纸。 */
:root{
  --bg:#02050c; --fg:#e8edf5; --muted:#8a97ad; --line:rgba(255,255,255,.14);
  --pin:#d8262f; --pin-hi:#ff9a9a; --pincore:#fff1ee; --ring:#ffffff; --star:#f3c969; --star2:#8ec5ff; --arc:#ff3b45;
  --page:#f7f6f2; --ink:#14181f; --ink2:#5b6270; --rule:#14181f; --accent:#1d3f8f; --pageline:rgba(20,24,31,.14);
  --f-serif:"Noto Serif SC","Songti SC","STSong",serif;
  --f-latin:"Instrument Serif","Times New Roman",serif;
  --f-sans:"Noto Sans SC","PingFang SC",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --cardw:min(500px,44vw);
  color-scheme:dark;
}
/* 蓝石：卫星图 + 白纸蓝墨 */
[data-style="marble"]{--ring:#ffffff;--bg:#02050c;--fg:#e8edf5;--muted:#8a97ad;--line:rgba(255,255,255,.14);--pin:#d8262f;--pin-hi:#ff9a9a;--pincore:#fff1ee;--star:#f3deb0;--star2:#9fd0ff;--arc:#f19a8f;
  --page:#f7f6f2;--ink:#14181f;--ink2:#5b6270;--rule:#14181f;--accent:#1d3f8f;--pageline:rgba(20,24,31,.14);color-scheme:dark}
/* 夜航：灯光图 + 炭黑纸金字 */
[data-style="night"]{--ring:#ffd2c4;--bg:#030407;--fg:#f3ead8;--muted:#9c927e;--line:rgba(255,220,160,.16);--pin:#ff5a3c;--pin-hi:#ffc2a8;--pincore:#fff6ec;--star:#f6e6c2;--star2:#b4d8ff;--arc:#ecd2a6;
  --page:#16140f;--ink:#efe6d2;--ink2:#a99d86;--rule:#efe6d2;--accent:#e9b75a;--pageline:rgba(239,230,210,.16);color-scheme:dark}
/* 旧图：蓝墨铜版地图（亚麻白纸 + 海港蓝墨） */
[data-style="paper"]{--ring:#E6E2DA;--bg:#E6E2DA;--fg:#1F2A38;--muted:#4F5D6E;--line:rgba(31,42,56,.2);--pin:#b3261e;--pin-hi:#e8776c;--pincore:#b3261e;--star:#b07a10;--star2:#3F5F86;--arc:#c0533f;
  --page:#f3ead3;--ink:#2b1f14;--ink2:#6e5a44;--rule:#2b1f14;--accent:#a8241a;--pageline:rgba(43,31,20,.18);color-scheme:light}

html,body{height:100%}
/* iOS 26 主屏 PWA（viewport-fit=cover + black-translucent）视口少算了状态栏那一截，底下一条黑边（WebKit bug 301108）。
   页面本身至少铺满整屏，iOS 才把完整视口给网页；只挪元素没用，系统在那条线上直接不画 */
@media (display-mode: standalone){ html{min-height:min(100lvh, calc(100% + env(safe-area-inset-top)))} }
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);overflow:hidden;transition:background .5s}
#globe{position:fixed;inset:0;bottom:0;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
body.open-side #globe{transform:translateX(calc(var(--cardw) / 2))}
body.open-sheet #globe{transform:translateY(-24%)}
body.open-sheet.full #globe{transform:translateY(-40%)}

.top{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;display:flex;align-items:center;gap:14px;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;transition:opacity .3s}
.brand h1{font:900 24px var(--f-serif);margin:0;letter-spacing:.18em;white-space:nowrap}
@media (max-width:420px){.brand .stat{display:none}}
.brand .stat{font:11px var(--f-mono);color:var(--muted);letter-spacing:.04em;white-space:nowrap}
body.open-side .brand{opacity:0;pointer-events:none}
.styles{display:flex;gap:2px;margin-left:auto;border:1px solid var(--line);border-radius:999px;padding:3px;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.styles button{font:500 12px var(--f-sans);color:var(--muted);background:transparent;border:0;border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.styles button[aria-pressed="true"]{color:var(--bg);background:var(--fg)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.legend{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:4;display:flex;flex-direction:column;gap:10px;width:min(290px,calc(100% - 32px));transition:opacity .3s}
body.open-side .legend,body.open-sheet .legend{opacity:0;pointer-events:none}
.chips{display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap}
.chips span{display:inline-flex;align-items:center;gap:6px}
.chips svg{width:16px;height:16px;overflow:visible}
.log{border-top:1px solid var(--line);padding-top:8px}
.log h3{margin:0 0 4px;font:500 10px var(--f-mono);letter-spacing:.16em;color:var(--muted);display:flex;justify-content:space-between}
.log ol{list-style:none;margin:0;padding:0;max-height:28vh;overflow:auto}
.log li{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:baseline;font:13px var(--f-serif);padding:3px 0;cursor:pointer;color:var(--fg)}
.log li:hover{color:var(--arc)}
.log .n{font:10px var(--f-mono);color:var(--arc)}
.log .d{font:10px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:899px){.log{display:none}}

/* 地球上的标记：外层由地球库定位（不加任何过渡，否则会晃），内层自己做动效 */
.mkw{width:0;height:0;pointer-events:none}
.mk{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer}
.mk svg{position:absolute;overflow:visible;display:block}
.mk.pin svg{left:calc(-10px*var(--pz,1));top:calc(-10px*var(--pz,1));width:calc(20px*var(--pz,1));height:calc(20px*var(--pz,1));overflow:visible}
.mk.pin .dot{transform-box:view-box;transform-origin:0 0;transition:transform .2s}
.mk.pin:hover .dot,.mk.on .dot{transform:scale(1.4)}
.mk.pin .hl{transform-box:view-box;transform-origin:0 0;opacity:.0;transition:opacity .3s}
.mk.on .hl{opacity:1;animation:ripple 2s ease-out infinite}
.mk.on .hl.h2{animation-delay:1s}
/* 深色底上涟漪发一点光，跟旧图纸面上一样看得清 */
[data-style="marble"] .mk.on .hl,[data-style="night"] .mk.on .hl{filter:drop-shadow(0 0 2px var(--pin))}
[data-style="marble"] .mk.on .hl{stroke:#ff5a5f}
@keyframes ripple{0%{transform:scale(.7);opacity:.9}100%{transform:scale(2.3);opacity:0}}
.mk.star svg{left:-16px;top:-16px;width:32px;height:32px}
.mk.star .gl{transform-box:view-box;transform-origin:0 0;animation:glow 2.8s ease-in-out infinite;animation-delay:inherit}
.mk.star .sp{transform-box:view-box;transform-origin:0 0;animation:tw 2.8s ease-in-out infinite;animation-delay:inherit}
.mk.star{animation-delay:var(--dl,0s)}
.mk.on.star .sp{transform:scale(1.35)}
.mk.star svg[viewBox='-20 -16 40 32']{left:-15px;top:-12px;width:30px;height:24px}
.mk.star .sp2,.mk.star .gl2{animation-delay:calc(var(--dl,0s) - 1.4s)}
@keyframes tw{0%,100%{transform:scale(1) rotate(0deg);opacity:1}50%{transform:scale(.7) rotate(12deg);opacity:.75}}
@keyframes glow{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(.6);opacity:.35}}
.mk .lb{position:absolute;left:10px;top:-24px;font:600 13px var(--f-serif);color:var(--fg);white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none;
  text-shadow:0 0 3px var(--bg),0 0 6px var(--bg),0 0 10px var(--bg)}
.mk.star .lb{left:12px;top:-24px}
.mk:hover .lb,.mk.on .lb,.mk.sl .lb{opacity:1}


/* 卡片 = 杂志内页 */
.card{position:fixed;z-index:6;background:var(--page);color:var(--ink);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  transition:transform .55s cubic-bezier(.2,.8,.2,1),max-height .4s;box-shadow:0 10px 50px rgba(0,0,0,.35);font-family:var(--f-serif)}
@media (min-width:900px){
  .card{left:0;top:0;bottom:0;width:var(--cardw);transform:translateX(-105%)}
  .card.show{transform:none}
}
@media (max-width:899px){
  .card{left:0;right:0;bottom:0;max-height:56%;border-radius:14px 14px 0 0;transform:translateY(105%);padding-bottom:env(safe-area-inset-bottom,0px)}
  .card.show{transform:none}
  body.full .card{max-height:calc(100% - env(safe-area-inset-top,0px) - 8px)}
}
.grab{display:none;position:sticky;top:0;z-index:2;height:22px;background:var(--page);cursor:pointer;border:0;width:100%}
.grab::after{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--pageline);margin:9px auto}
@media (max-width:899px){.grab{display:block}}
.title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.title h2{font:900 clamp(44px,9vw,64px)/1.02 var(--f-serif);margin:6px 0 0;letter-spacing:.02em;text-wrap:balance;min-width:0}
.sil{flex:none;width:84px;height:84px}
.sil path{fill:color-mix(in srgb,var(--accent) 10%,transparent);stroke:var(--accent);stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.orig{font:italic 400 24px var(--f-latin);color:var(--ink2);margin-top:2px}
.dek{font:400 17px/1.6 var(--f-serif);margin:14px 0 0;color:var(--ink);text-wrap:balance}
.sh{display:flex;align-items:baseline;gap:10px;margin:34px 0 12px;border-top:1px solid var(--rule);padding-top:8px}
.sh b{font:900 15px var(--f-serif);letter-spacing:.3em}
.sh i{font:italic 15px var(--f-latin);color:var(--ink2)}
.pull{margin:26px 0 8px;padding:16px 0;border-top:3px solid var(--accent);border-bottom:1px solid var(--accent);font:600 22px/1.55 var(--f-serif);color:var(--accent);text-wrap:balance}
.empty{color:var(--ink2);font:14px/1.8 var(--f-serif)}
.colo{margin-top:36px;padding-top:10px;border-top:2px solid var(--rule);font:10px/1.7 var(--f-mono);color:var(--ink2);letter-spacing:.04em}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);z-index:9;background:var(--fg);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:999px;transition:opacity .3s;max-width:calc(100% - 32px)}
.toast[hidden]{display:block!important;opacity:0;pointer-events:none}

/* ---------- 骰子 / 抽中的城名 ---------- */
.layer[hidden],.dicepop[hidden],.ticker[hidden],#chatN[hidden]{display:none!important}
.styles#styles{margin-left:0}
@media (max-width:600px){ .top{flex-wrap:wrap;row-gap:8px} .brand{width:100%} }
.dice{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:5;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 75%,transparent);color:var(--fg);cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;transition:transform .3s}
.dice svg{width:26px;height:26px}
.dice:hover{transform:rotate(-12deg)}
body.open-side .dice,body.open-sheet .dice{opacity:0;pointer-events:none}
.dicepop{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);z-index:7;background:var(--page);color:var(--ink);border:1px solid var(--pageline);box-shadow:0 8px 30px rgba(0,0,0,.3);padding:12px;display:grid;gap:6px;min-width:160px;font-family:var(--f-serif)}
.dicepop b{font:500 10px var(--f-mono);letter-spacing:.14em;color:var(--ink2)}
.dicepop button{font:15px var(--f-serif);text-align:left;border:0;border-top:1px solid var(--pageline);background:none;color:var(--ink);padding:8px 2px;cursor:pointer}
.ticker{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:8;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--fg);text-shadow:0 0 14px var(--bg),0 0 28px var(--bg);pointer-events:none;text-align:center;white-space:nowrap}
.ticker b{font:700 clamp(24px,6vw,34px) var(--f-serif);letter-spacing:.06em}
.ticker i{font:italic 400 clamp(18px,4.8vw,24px) var(--f-latin);opacity:.85;letter-spacing:.04em}   /* 中文一行 + 英文一行 */

.tagbar{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.tg{font:12px var(--f-sans);border:1px solid var(--pageline);background:none;color:var(--ink2);padding:4px 10px;border-radius:999px;cursor:pointer}
.tg.on{background:var(--ink);color:var(--page);border-color:var(--ink)}
.tg:disabled{cursor:default}
.va{display:flex;align-items:center;gap:8px;margin:10px 0 4px;flex-wrap:wrap}
.lbt textarea,.shin textarea{flex:1;min-width:0;font:14px var(--f-sans);color:var(--ink);background:color-mix(in srgb,var(--page) 80%,var(--ink) 4%);border:1px solid var(--pageline);padding:8px 10px;border-radius:0;box-sizing:border-box}
.lbt textarea,.shin textarea{width:100%;resize:vertical;font-family:var(--f-serif);font-size:15px}
.hint{font:12px var(--f-sans);color:var(--ink2);margin:0}
/* 浮层：搜索 / 这一次 / 照片大图 / 加照片 */
.layer{position:fixed;inset:0;bottom:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;overflow:auto;padding-top:env(safe-area-inset-top,0px)}
@media (min-width:700px){.layer{align-items:center}}
.lbin,.shin{position:relative;background:var(--page);color:var(--ink);width:min(560px,100%);max-height:94%;overflow:auto;box-sizing:border-box;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));font-family:var(--f-serif)}
.lbin{padding:0}
.lbin>img{width:100%;max-height:60vh;object-fit:contain;background:#000;display:block}
.lbin>.x{position:absolute;right:10px;top:10px;z-index:2;background:rgba(0,0,0,.5);color:#fff;border:0;width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer}
.lbt{padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.shin .x{border:0;background:none;font:22px var(--f-latin);color:var(--ink);cursor:pointer}
.chip{display:block;width:100%;text-align:left;border:1px solid var(--pageline);background:none;color:var(--ink);padding:10px 12px;margin-top:10px;cursor:pointer;font-family:var(--f-serif)}

/* ---------- 基础 ---------- */
[hidden]{display:none!important}
html,body{margin:0}
*,*::before,*::after{box-sizing:border-box}

/* ---------- 长卷卡片：固定的五色，不随地球风格变 ---------- */
.card{--page:#E6E2DA;--ink:#1F2A38;--ink2:#4F5D6E;--accent:#3F5F86;--sky:#6F9FC8;--dune:#D8CBB2;--clay:#CFC9C3;--pageline:rgba(31,42,56,.14);--rule:#1F2A38;
  background:#E6E2DA;background-image:radial-gradient(rgba(63,95,134,.06) 1px,transparent 1px),radial-gradient(rgba(79,93,110,.05) 1px,transparent 1px);background-size:5px 5px,7px 7px;background-position:0 0,2px 3px;color:var(--ink);color-scheme:light}
.card .x.float{position:absolute;right:12px;top:12px;z-index:3;width:40px;height:40px;border-radius:50%;border:0;background:rgba(31,42,56,.55);color:#fff;font:400 22px/1 var(--f-latin);cursor:pointer}
@media (max-width:899px){.card .x.float{top:26px}}
.grab{background:transparent}
.lh{position:relative;min-height:420px;display:flex;align-items:flex-end;overflow:hidden;margin-top:0}
@media (max-width:899px){.lh{margin-top:-22px}}
.lh-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.lh-fade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,12,16,.25),transparent 25%,transparent 48%,rgba(230,226,218,.92) 86%,#E6E2DA)}
.lh.plain{min-height:0;padding-top:56px}
.lh.plain .lh-fade{display:none}
.lh-t{position:relative;padding:0 22px 10px;display:flex;flex-direction:column;gap:6px;width:100%}
.kick{font:500 10px var(--f-mono);letter-spacing:.16em;color:var(--ink2)}
.lh h2{margin:0;font:900 clamp(44px,12vw,64px)/1.02 var(--f-serif);text-wrap:balance}
.lh .orig{font:italic 22px var(--f-latin);color:var(--ink2)}
.lh .dek{margin:4px 0 0;font:17px/1.7 var(--f-serif)}
.lh .title{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.ls{padding:24px 22px 4px}
.ls.wide{padding-left:0;padding-right:0}
.ls.wide .sh{margin-left:22px;margin-right:22px}
.ls .sh{margin:0 0 14px}
.sh .cnt{margin-left:auto;font:500 12px var(--f-mono);color:var(--ink2)}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:1px;background:rgba(63,95,134,.35)}
.node{position:relative;padding-bottom:10px}
.node .dot{position:absolute;left:-23px;top:15px;width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);background:#E6E2DA}
.node.on .dot{background:var(--accent)}
.nb{display:flex;align-items:baseline;gap:12px;width:100%;min-height:44px;padding:0;border:0;background:none;color:var(--ink);cursor:pointer;text-align:left}
.ny{flex:none;min-width:58px;font:500 13px var(--f-mono);color:var(--accent)}
.nh{font:600 16.5px/1.5 var(--f-serif)}
.ns{margin-left:auto;flex:none;color:var(--ink2);font-size:18px}
.np,.bp{margin:4px 0 12px;font:15.5px/1.95 var(--f-serif);text-align:justify;color:#26323F}
.np{margin-left:70px}
@media (max-width:420px){.np{margin-left:0}}
.ls .pull{margin:6px 0 14px;padding:16px 0;border-top:3px solid var(--accent);border-bottom:1px solid var(--accent);font:600 21px/1.55 var(--f-serif);color:var(--accent)}
.ls .pull::before{content:none}
.lk{border:0;background:none;color:var(--accent);font:14px var(--f-sans);cursor:pointer;padding:6px 0;min-height:40px;text-decoration:underline;text-underline-offset:3px}
/* 景点轮播 */
.car{position:relative}
.rail{display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none;
  padding:6px calc((100% - min(300px,78vw))/2) 10px;scroll-padding-inline:calc((100% - min(300px,78vw))/2)}
.rail::-webkit-scrollbar{display:none}
.sc{flex:none;width:min(300px,78vw);height:400px;position:relative;padding:0;border:0;cursor:pointer;overflow:hidden;background:var(--clay);scroll-snap-align:center;scroll-snap-stop:always;will-change:transform;border-radius:2px;box-shadow:0 10px 26px rgba(31,42,56,.18)}
.sc{isolation:isolate}
.sc-in{position:absolute;inset:0;overflow:hidden;z-index:0}
.sc-in img{will-change:transform;transform:scale(1.12)}
.sc img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
/* iOS Safari：图片带 will-change:transform 会被提成 GPU 图层画到最上面，盖住渐变和景点名 → 三层都显式排好并各自提层 */

<script>
async function getJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
let TAGS = ["美食","风景","名胜","艺术品","个人照片"];   // 照片标签，以 /api/config 下发的为准
// 网页的使用者就是 me；partner（同行的人，常常是 AI 伴侣）带钥匙走 /mcp 或 cli/stopover.py，这里显示它的星星、留言和递来的东西
let state = {ck:[], wish:[], photos:[], notes:[], cmts:[], shares:[], cfg:{me:"我", partner:"TA", default_origin:{}, domestic_countries:[], clocks:[], features:{}}};
const NAME = by => (by==="partner" ? state.cfg.partner : state.cfg.me) || by;
const SH = () => !!state.cfg.features?.share;          // 递送 / 对话 / 收件箱 / 通知：配置 features.share=false 时一概不出现
const PT = () => NAME("partner");
const PLANE='<svg aria-hidden="true" viewBox="0 0 24 24" class="plane"><path d="M21 3 3 10.5l7 2.5 2.5 7L21 3Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m10 13 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
async function api(method, path, body){
  const r = await fetch("api/"+path, {method, headers:body?{"Content-Type":"application/json"}:{}, body:body?JSON.stringify(body):undefined});
  if(!r.ok){ let m=r.status; try{ m=(await r.json()).detail||m }catch(e){} throw new Error(m); }
  return r.json();
}
async function loadState(){
  const d=await getJSON("api/state");
  state.ck=d.checkins||[];
  state.wish=(d.wishes||[]).map(w=>({id:w.city,by:w.by,note:w.note||""}));
  state.photos=d.photos||[]; state.notes=d.notes||[]; state.cmts=d.comments||[]; state.shares=d.shares||[];
  if(d.config){ state.cfg={...state.cfg, ...d.config}; if(d.config.tags?.length) TAGS=d.config.tags; applyNames(); }
  if(world) updateSun();
}
const CITIES = [];            // {id,name,en,country,lat,lng,has}，启动时从 data/cities.json 填
const byId = {};
const home = () => state.cfg.home || {};
let IDX = {}, DATA = {};   // IDX=有资料城市的索引（bbox/档位）；DATA=已加载的城市页（点开时按需取）

const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const R = Math.PI/180;
const km=(a,b)=>{const d=Math.sin((b.lat-a.lat)*R/2)**2+Math.cos(a.lat*R)*Math.cos(b.lat*R)*Math.sin((b.lng-a.lng)*R/2)**2;return Math.round(12742*Math.asin(Math.sqrt(d)))};
const fLat=v=>Math.abs(v).toFixed(2)+"°"+(v>=0?"N":"S"), fLng=v=>Math.abs(v).toFixed(2)+"°"+(v>=0?"E":"W");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const wide = ()=>innerWidth>=900;

// 想去：谁点的星（me / partner），两人都点了 = both
function wishKind(id){ const by=new Set(state.wish.filter(w=>w.id===id).map(w=>w.by)); return by.size>1?"both":[...by][0]; }
const ckOf = id => state.ck.find(x=>x.city===id);
const tripsOf = id => state.ck.filter(x=>x.city===id);   // 一座城可以来很多次：每次一条，各自的出发地
// 默认出发地：domestic_countries 里的国家用 domestic，其余用 abroad
const defOriginOf = id => { const o=state.cfg.default_origin||{}; return (state.cfg.domestic_countries||[]).includes(byId[id]?.country) ? o.domestic : o.abroad; };
// 图例和标题里的名字跟着配置走
function applyNames(){
  const me=state.cfg.me||"我", pt=state.cfg.partner||"TA";
  const a=$("#lg-me"), b=$("#lg-pt"); if(a) a.textContent=me+"想去"; if(b) b.textContent=pt+"想去";
}
function legs(){
  // 红线不按时间，按「从哪儿出发」连：每次打卡从它的出发地连过来（没有出发地 = 它自己就是起点）
  const out=[], seen=new Set();
  // 终点：这一次从这座城回到哪儿，多画一段 城→终点
  for(const x of state.ck){ const a=byId[x.city], b=byId[x.dest]; if(!a||!b||seen.has(x.city+">"+x.dest)) continue; seen.add(x.city+">"+x.dest);
    out.push({startLat:a.lat,startLng:a.lng,endLat:b.lat,endLng:b.lng,km:km(a,b),city:x.dest,origin:x.city,back:1}); }
  for(const x of state.ck){ const a=byId[x.origin], b=byId[x.city]; if(!a||!b||seen.has(x.origin+">"+x.city)) continue; seen.add(x.origin+">"+x.city);
    out.push({startLat:a.lat,startLng:a.lng,endLat:b.lat,endLng:b.lng,km:km(a,b),city:x.city,origin:x.origin}); }
  return {out};
}
// 侧栏顺序：从起点往下一串一串排（A → B → C），同一出发地按打卡先后
function ckTree(){
  const have=new Set(state.ck.map(x=>x.city)), kids={}, roots=[];
  for(const x of state.ck){ if(!byId[x.city]) continue; (x.origin&&have.has(x.origin)) ? (kids[x.origin]=kids[x.origin]||[]).push(x) : roots.push(x); }
  const out=[], done=new Set(), opened=new Set(), walk=(x,d)=>{ if(done.has(x.id)) return; done.add(x.id); out.push({...x,d});
    if(opened.has(x.city)) return; opened.add(x.city); (kids[x.city]||[]).forEach(k=>walk(k,d+1)); };
  roots.forEach(r=>walk(r,0)); state.ck.forEach(x=>byId[x.city]&&walk(x,0));
  return out;
}
function renderSide(){
  const {out}=legs(), cities=new Set(state.ck.map(x=>x.city)), v=ckTree();
  $("#stat").textContent=`已经停 ${cities.size} 城 · 想去 ${state.wish.filter(w=>!cities.has(w.id)).length} 城`;
  $("#total").textContent=out.reduce((s,l)=>s+l.km,0).toLocaleString("zh-CN")+" KM";
  $("#log").innerHTML=v.map((x,i)=>`<li tabindex="0" data-id="${x.city}" data-k="${x.id}"><span class="n">${String(i+1).padStart(2,"0")}</span><span style="padding-left:${Math.min(x.d,4)*10}px">${x.d?"↳ ":""}${esc(byId[x.city].name)}</span><span class="d">${byId[x.origin]?"从 "+esc(byId[x.origin].name):"起点"}${byId[x.dest]?" · 回 "+esc(byId[x.dest].name):""}</span></li>`).join("");
  $("#log").querySelectorAll("li").forEach(li=>{li.onclick=()=>openCity(li.dataset.id);li.onkeydown=e=>{if(e.key==="Enter")openCity(li.dataset.id)}});
  // 「递来的」：partner 递来的东西，没点开过的算未读（红点）
  const fromPt=(state.shares||[]).filter(x=>x.who==="partner"), n=fromPt.filter(x=>!x.read_at).length;
  $("#chatbtn").hidden=!SH()||!fromPt.length; $("#chatN").textContent=n||""; $("#chatN").hidden=!n;
  $("#chatbtn").setAttribute("aria-label", `${PT()}递来的${n?`，${n} 样没看`:""}`);
  renderBell();
}

// 放大到一定程度：屏幕范围内有资料的城市显示名字（名城优先，最多 40 个），点名字打开
let nameLabels=[], ptsOn=true;
function updateNames(){
  if(!world) return;

  // 放大后，按地面算大小的淡点会变成大圆盘：这时收起，改由名字旁的小圆点标位置
  const wantPts = alt>=.9;
  if(wantPts!==ptsOn){ ptsOn=wantPts; world.pointsData(wantPts?CITIES.filter(c=>c.has):[]); }
  let out=[], pinShow=[];
  if(alt<.9){
    const r=Math.max(80, alt*3600);   // 屏幕大致能看到的半径（公里）
    const taken=new Set([...state.ck.map(v=>v.city),...state.wish.map(w=>w.id)]);
    const cand=CITIES.filter(c=>c.has && !taken.has(c.id) && km(p,c)<r)
      .sort((a,b)=>(IDX[a.id]?.t==="p"?0:1)-(IDX[b.id]?.t==="p"?0:1) || km(p,a)-km(p,b)).slice(0,160);
    // 避让：名气高的先放，后面的和已放的名字重叠就先不显示，放得更大时自然会露出来
    const placed=[], W=innerWidth, H=innerHeight;
    const hub=new Set(state.ck.map(x=>x.origin).filter(Boolean));
    // 来过的城先占位、名字常显；出发地优先，互相重叠的先让给离中心近的
    for(const x of [...state.ck].map(x=>byId[x.city]).filter(x=>x&&km(p,x)<r).sort((a,b)=>(hub.has(b.id)-hub.has(a.id))||km(p,a)-km(p,b))){
      const sc=world.getScreenCoords(x.lat,x.lng,0); if(!sc||sc.x<0||sc.x>W||sc.y<0||sc.y>H) continue;
      const w=x.name.length*13+12, h=20, lx=sc.x+8, ly=sc.y-26;
      placed.push({x:sc.x-6,y:sc.y-6,w:12,h:12});    // 红点本身也占地方，普通城名别压上去
      if(placed.some(q=>lx<q.x+q.w && lx+w>q.x && ly<q.y+q.h && ly+h>q.y)) continue;
      placed.push({x:lx,y:ly,w,h}); pinShow.push(x.id);
    }
    for(const c of cand){
      const sc=world.getScreenCoords(c.lat,c.lng,0); if(!sc) continue;
      const w=c.name.length*13+12, h=20, x=sc.x-w/2, y=sc.y-30;
      if(sc.x<0||sc.x>W||sc.y<0||sc.y>H) continue;
      if(placed.some(q=>x<q.x+q.w && x+w>q.x && y<q.y+q.h && y+h>q.y)) continue;
      placed.push({x,y,w,h}); out.push({...c,t:"name"});

let _nt; const scheduleNames=()=>{ clearTimeout(_nt); _nt=setTimeout(updateNames,180); };
function markers(){
  const out=[...nameLabels], seen=new Set();

// 地图瓦片：像手机地图那样越放大越细。蓝石 = NASA Blue Marble，夜航 = NASA Black Marble，都是 GIBS 瓦片（最大 z=8）。

const STYLES={
  marble:{tiles:(x,y,l)=>`${GIBS}/BlueMarble_ShadedRelief_Bathymetry/default/GoogleMapsCompatible_Level8/${l}/${y}/${x}.jpeg`, maxL:8, img:"tex/earth-blue-marble.jpg",

let world=null,countries=null,current=null,selId=null,glow=null,THREE=null;
// 航线发光层：每条航段一根管子，着色器按"中心亮、往外平滑衰减"上色，叠加混合，像雾里的光柱。
// 管子的粗细在顶点着色器里按到相机的距离放大，所以光晕在屏幕上始终是固定的几像素宽，缩放不会变粗方块。
const GLOW_VS=`
attribute vec3 aPrev, aNext; attribute float aSide, aU;
uniform float uWidth;
varying float vU, vS, vFade;
void main(){
  vec3 c = (modelMatrix*vec4(position,1.)).xyz, pr = (modelMatrix*vec4(aPrev,1.)).xyz, nx = (modelMatrix*vec4(aNext,1.)).xyz;
  vec3 view = normalize(cameraPosition - c);
  vec3 tan = normalize(nx - pr);
  vec3 side = normalize(cross(tan, view));
  float d = distance(cameraPosition, c);
  vec3 wp = c + side*aSide*uWidth*d + view*uWidth*d*1.2;   // 横向撑开成正对屏幕的光带；再朝相机挪一点，免得被地表挡住
  vU = aU; vS = aSide;
  vFade = smoothstep(.04, .35, dot(normalize(c), view));   // 越接近地球边缘越淡，像被大气吃掉
  gl_Position = projectionMatrix*viewMatrix*vec4(wp,1.);
}`;
const GLOW_FS=`
uniform vec3 uColor; uniform float uTime, uT, uPh, uHead, uTail, uBase, uCore, uComet, uWhite, uStitch, uAdd, uEnd;
varying float vU, vS, vFade;
float ease(float x){ return x<.5 ? 4.*x*x*x : 1.-pow(-2.*x+2.,3.)/2.; }
void main(){
  float r = abs(vS);                                           // 0=中心，1=光带边缘
  float core = exp(-pow(r/.11, 2.));                           // 极细的亮芯
  float halo = exp(-pow(r/.22, 2.))*.5 + exp(-pow(r/.6, 2.))*.2;  // 两层高斯叠出的雾光，边缘自然归零
  float h = ease(fract(uTime/uT + uPh));
  float dx = vU - h;
  float c = dx < 0. ? exp(dx/uTail) : exp(-dx*dx/(uHead*uHead));
  c *= smoothstep(0., .1, h) * (1. - smoothstep(.9, 1., h));
  float st = uStitch > 0. ? step(.45, fract(vU*uStitch)) : 1.;
  float ends = smoothstep(0., uEnd, vU) * (1. - smoothstep(1.-uEnd, 1., vU));   // 两头只在最后约 1 公里淡出，放大后线头仍贴着红点
  float I = (core*(uCore*st + c*1.4) + halo*(uBase + c*uComet)) * ends * vFade;
  vec3 col = mix(uColor, vec3(1.), clamp(core*uWhite*(.3 + c), 0., 1.));
  if(uAdd > .5) gl_FragColor = vec4(col*I, 1.);
  else gl_FragColor = vec4(col, clamp(I, 0., 1.));
}`;
const GLOW_STYLE={
  marble:{width:.008,base:.42,core:.95,comet:.95,white:.5,add:1},
  night:{width:.0095,base:.45,core:.95,comet:1.1,white:.55,add:1},

async function loadThree(){ if(!THREE){ try{ THREE=await import("https://cdn.jsdelivr.net/npm/three@0.185.0/+esm"); }catch(e){ THREE=null; } } return THREE; }
function buildGlow(){
  if(glow){ world.scene().remove(glow.group); glow.group.traverse(o=>{o.geometry?.dispose();o.material?.dispose()}); glow=null; }
  if(!THREE) return;
  const G=GLOW_STYLE[current], col=new THREE.Color(css("--arc")), group=new THREE.Group(), mats=[];
  legs().out.forEach((l,i)=>{
    const a=new THREE.Vector3().setFromSphericalCoords(1,(90-l.startLat)*R,l.startLng*R), b=new THREE.Vector3().setFromSphericalCoords(1,(90-l.endLat)*R,l.endLng*R);
    const om=a.angleTo(b), hgt=Math.max(.004,.08*om), pts=[];   // 贴地微拱：1000 公里的航段只拱起约 80 公里
    for(let k=0;k<=64;k++){ const t=k/64, s1=Math.sin((1-t)*om)/Math.sin(om), s2=Math.sin(t*om)/Math.sin(om);
      const v=a.clone().multiplyScalar(s1).add(b.clone().multiplyScalar(s2)).normalize();
      const lat=90-Math.acos(v.y)/R, lng=Math.atan2(v.x,v.z)/R, c=world.getCoords(lat,lng,(hgt+.002)*Math.sin(Math.PI*t));   // 两端贴地：整条抬高的话，放大后视差会让线头偏离红点

    const pos=[],prev=[],next=[],side=[],uu=[],idx=[];
    P.forEach((q,k)=>{ const qp=P[Math.max(0,k-1)], qn=P[Math.min(N,k+1)];
      for(const sd of [-1,1]){ pos.push(q.x,q.y,q.z); prev.push(qp.x,qp.y,qp.z); next.push(qn.x,qn.y,qn.z); side.push(sd); uu.push(k/N); }
      if(k<N){ const o=k*2; idx.push(o,o+1,o+2, o+1,o+3,o+2); } });
    const geo=new THREE.BufferGeometry();
    geo.setAttribute("position",new THREE.Float32BufferAttribute(pos,3)); geo.setAttribute("aPrev",new THREE.Float32BufferAttribute(prev,3));
    geo.setAttribute("aNext",new THREE.Float32BufferAttribute(next,3)); geo.setAttribute("aSide",new THREE.Float32BufferAttribute(side,1));
    geo.setAttribute("aU",new THREE.Float32BufferAttribute(uu,1)); geo.setIndex(idx);

        uWhite:{value:G.white},uEnd:{value:Math.min(.012,1/l.km)},uStitch:{value:current==="paper"?l.km/14:0},uAdd:{value:G.add}}});
    mats.push(m); {const me=new THREE.Mesh(geo,m); me.frustumCulled=false; me.renderOrder=1000; group.add(me);}   // 画在晨昏层之后，夜里的航线照样亮
  });

}

// ---------- 铜版画：用球面经纬度算排线，排线跟着地球转；缩小时按 fwidth 淡成灰调，避免摩尔纹 ----------
const ENGRAVE_VS=`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`;
const ENGRAVE_FS=`
uniform vec3 uPaper, uInk; uniform float uKind, uScale;
varying vec3 vP;
float lines(float v, float w){   // 发丝线：线宽固定约 1.2 像素（像刻刀划的），不随线距变粗；太密时退成平均灰度
  float fw=max(fwidth(v),1e-4); float dv=min(fract(v),1.-fract(v));
  float l=1.-smoothstep(fw*.35, fw*1.15, dv);
  return mix(l, min(1., fw*1.5), smoothstep(.22,.5,fw)); }
void main(){
  vec3 n=normalize(vP); float lat=degrees(asin(n.y)), lng=degrees(atan(n.x,n.z));
  float ink;
  if(uKind<.5){ ink = lines((lat*.7+lng*.7)*.72*uScale, .09)*.42; }      // 陆地：45° 斜排线（发丝线）
  else { ink = lines(lat*.55*uScale, .06)*.22; }                            // 海：顺着纬线的细水纹
  gl_FragColor=vec4(mix(uPaper, uInk, ink), 1.);
}`;
// 排线密度：每放大一倍密一倍（按 2 的幂取整，避免缩放时一直抖），屏幕上的线距大致不变
const ENGRAVE_SCALE={value:1};
function updateEngraveScale(){ if(!world||current!=="paper") return; const a=world.pointOfView().altitude;
  const v=Math.max(1,Math.min(64,Math.pow(2,Math.round(Math.log2(1.0/Math.max(a,.02))))));
  if(v===ENGRAVE_SCALE.value && ENGRAVE_SCALE.done) return; ENGRAVE_SCALE.value=v; ENGRAVE_SCALE.done=1;
  // 地球库会给每个国家复制一份材质（参数也跟着拷成副本），所以逐个找出来改
  world.scene().traverse(o=>{ const u=o.material?.uniforms; if(u?.uScale) u.uScale.value=v; }); }
function engraveMat(kind){
  return new THREE.ShaderMaterial({vertexShader:ENGRAVE_VS, fragmentShader:ENGRAVE_FS, extensions:{derivatives:true},
    uniforms:{uPaper:{value:new THREE.Color(kind==="land"?"#ddd2bb":"#dfe6ea")}, uInk:{value:new THREE.Color(kind==="land"?"#3F5F86":"#6F9FC8")}, uKind:{value:kind==="land"?0:1}, uScale:ENGRAVE_SCALE}});
}
let grat=null;
function buildGraticule(){
  if(!THREE||!world) return;
  const R=world.getGlobeRadius()*1.0035, pts=[], P=(la,lo)=>{ const c=world.getCoords(la,lo,.0035); return [c.x,c.y,c.z]; };
  for(let lo=-180; lo<180; lo+=30) for(let la=-80; la<80; la+=2) pts.push(...P(la,lo),...P(la+2,lo));
  for(let la=-60; la<=60; la+=30) for(let lo=-180; lo<180; lo+=2) pts.push(...P(la,lo),...P(la,lo+2));
  const geo=new THREE.BufferGeometry(); geo.setAttribute("position",new THREE.Float32BufferAttribute(pts,3));
  grat=new THREE.LineSegments(geo,new THREE.LineBasicMaterial({color:0x3F5F86,transparent:true,opacity:.16,depthWrite:false}));
  world.scene().add(grat);
}

// ---------- 晨昏线：按此刻太阳直射点算昼夜，每分钟更新 ----------
function subsolar(t=Date.now()){
  const d=t/864e5+2440587.5-2451545.0, rad=Math.PI/180;
  const g=(357.529+.98560028*d)*rad, q=280.459+.98564736*d;
  const L=(q+1.915*Math.sin(g)+.020*Math.sin(2*g))*rad, e=(23.439-.00000036*d)*rad;
  const ra=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L))/rad, dec=Math.asin(Math.sin(e)*Math.sin(L))/rad;
  const gmst=(280.46061837+360.98564736629*d)%360;
  let lng=ra-gmst; lng=((lng+540)%360)-180;
  return {lat:dec,lng};
}
const TERM_VS=`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`;
const TERM_FS=`
uniform vec3 uSun, uLine, uNight; uniform float uStyle, uScale, uFar; uniform sampler2D uLights;
varying vec3 vP;
void main(){
  vec3 n=normalize(vP); float d=dot(n,uSun);
  float night=1.-smoothstep(-.10,.04,d), line=exp(-pow(d/.008,2.));   // smoothstep 的两个边界不能反着写（GLSL 未定义，有的显卡直接给 0）
  vec4 c=vec4(0.);
  if(uStyle<.5){            // 蓝石：像从太空看真实地球——没有线，宽而柔的暮光过渡 + 很淡的余晖 + 夜里亮起城市灯光
    float nt=1.-smoothstep(-.28,.07,d);                         // 暮光很宽：天是慢慢黑下来的
    float glow=exp(-pow((d+.05)/.09,2.))*.16;                   // 日落余晖，只是一层很淡的暖色
    float lat=degrees(asin(n.y)), lng=degrees(atan(n.x,n.z));
    vec3 L=texture2D(uLights, vec2((lng+180.)/360., (lat+90.)/180.)).rgb;
    float lum=dot(L,vec3(.3,.5,.2))*smoothstep(.05,.6,nt)*uFar; // 灯光只在真正入夜后亮；放大后灯光贴图会糊成白雾，按远近淡出
    vec3 col=mix(uNight, vec3(1.,.62,.35), glow/(nt*.74+glow+1e-4));
    col=mix(col, L*1.5, clamp(lum*2.4,0.,1.));
    c=vec4(col, clamp((nt*.74+glow)*mix(.35,1.,uFar)+lum*1.2,0.,.95));   // 放大到城市级，夜色也只留薄薄一层，地图要看得清
  } else if(uStyle<1.5){    // 夜航：白天那半边压暗灯光，分界一条金线
    c=vec4(vec3(.02,.05,.12), (1.-night)*.62); c=mix(c, vec4(uLine,.7), line*.85);
  } else {                  // 旧图：夜半边交叉排线，分界一条墨线
    float lat=degrees(asin(n.y)), lng=degrees(atan(n.x,n.z)), v=(lat*.7-lng*.7)*1.6*uScale, fw=fwidth(v);
    float h=1.-smoothstep(.12-fw,.12+fw,.5-abs(fract(v)-.5)); h=mix(h,.24,smoothstep(.25,.6,fw));
    c=vec4(uNight, h*night*.55); c=mix(c, vec4(uLine,.75), line);
  }
  gl_FragColor=c;
}`;
let term=null, LIGHTS=null;   // 蓝石夜半边的城市灯光（复用夜航的灯光贴图）
function buildTerminator(){
  term=null;
  if(!THREE||!world) return;
  if(current!=="marble"){ updateSun(); return; }   // 只有蓝石有晨昏线：夜航本来就是"全世界的夜"，旧图的夜半边排线太花
  const st=current==="marble"?0:current==="night"?1:2;
  const R=world.getGlobeRadius()*1.0045;   // 瓦片地图画得比球面略高，晨昏层要再高一点才不被挡住
  // 瓦片在深度上会压住它（只在球边缘露出一点）→ 不做深度检测；只画朝镜头的正面，不会透到背面
  const mat=new THREE.ShaderMaterial({vertexShader:TERM_VS, fragmentShader:TERM_FS, transparent:true, depthWrite:false, depthTest:false, extensions:{derivatives:true},
    uniforms:{uSun:{value:new THREE.Vector3(1,0,0)}, uStyle:{value:st}, uFar:{value:Math.max(0,Math.min(1,(world.pointOfView().altitude-.25)/.65))}, uScale:{value:ENGRAVE_SCALE.value},
      uLine:{value:new THREE.Color(st===0?"#ffd9a0":st===1?"#f2c46a":"#3b2a1a")}, uNight:{value:new THREE.Color(st===2?"#3b2a1a":"#030712")},
      uLights:{value:LIGHTS||(LIGHTS=new THREE.TextureLoader().load("tex/earth-night.jpg"))}}});
  term=new THREE.Mesh(new THREE.SphereGeometry(R,96,64),mat); term.renderOrder=999;   // 瓦片带淡入、算半透明，会画在后面盖住晨昏层；排到最后画
  world.scene().add(term); updateSun();
}
function updateSun(){
  if(!world) return;
  const s=subsolar(), c=world.getCoords(s.lat,s.lng,0);
  term?.material.uniforms.uSun.value.set(c.x,c.y,c.z).normalize();
  const fmt=tz=>new Intl.DateTimeFormat("zh-CN",{timeZone:tz,hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date());
  const day=(lat,lng)=>{ const v=world.getCoords(lat,lng,0); return v.x*c.x+v.y*c.y+v.z*c.z>0; };
  // 时钟来自配置 clocks：[{label, tz, lat?, lng?}]；时区和家一样的钟用家的坐标判断昼夜，没坐标的不画日月
  const H=home(), clocks=state.cfg.clocks||[];
  const parts=clocks.map(k=>{ let t; try{ t=fmt(k.tz||undefined); }catch(e){ return ""; }
    const ll = k.lat!=null&&k.lng!=null ? k : (k.tz&&k.tz===H.tz&&H.lat!=null ? H : null);
    return `${esc(k.label||k.tz||"")} ${t}${ll?(day(ll.lat,ll.lng)?"☀︎":"☾"):""}`; }).filter(Boolean);
  $("#now").innerHTML = parts.length ? "此刻 · "+parts.join(" · ") : "";
}
setInterval(updateSun,60000);

function zoomFor(id){

  if(b){const span=Math.max(km({lat:b[0],lng:b[2]},{lat:b[1],lng:b[2]}),km({lat:b[0],lng:b[2]},{lat:b[0],lng:b[3]})); alt=Math.min(.45,Math.max(STYLES[current]?.minAlt??.12,span/600));}
  return alt;

function silhouette(id){
  const o=DATA[id]?.outline; if(!o) return "";
  const polys=o.type==="Polygon"?[o.coordinates]:o.coordinates;
  const pts=polys.flatMap(p=>p[0]); const lat0=pts.reduce((s,p)=>s+p[1],0)/pts.length, k=Math.cos(lat0*R);
  const xs=pts.map(p=>p[0]*k), ys=pts.map(p=>-p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),s=Math.max(x1-x0,y1-y0)||1;
  const ox=(s-(x1-x0))/s*50, oy=(s-(y1-y0))/s*50;
  const d=polys.map(p=>"M"+p[0].map(([lng,lat])=>((lng*k-x0)/s*100+ox).toFixed(1)+","+((-lat-y0)/s*100+oy).toFixed(1)).join("L")+"Z").join("");
  return `<svg class="sil" viewBox="-4 -4 108 108" aria-label="城市轮廓"><path d="${d}"/></svg>`;
}

async function startGen(id, pro){
  try{ const r=await api("POST",`city/${encodeURIComponent(id)}/gen`,{pro}); GEN[id]=r; if(selId===id) rerender(); pollGen(id); }
  catch(e){ toast(e.message); }
}
async function pollGen(id){
  for(let k=0;k<120;k++){
    await new Promise(r=>setTimeout(r,2500));
    let r; try{ r=await getJSON(`api/city/${encodeURIComponent(id)}/gen`); }catch(e){ continue; }
    GEN[id]=r;
    if(r.status==="done"){
      if(!IDX[id]){ try{ const d=await getJSON("data/cities.json?t="+Date.now()); const e=d.cities.find(x=>x.id===id); if(e) IDX[id]=e; }catch(e){} }
      if(byId[id]) byId[id].has=1; DATA[id]=undefined; await loadCity(id);
      if(world&&ptsOn) world.pointsData(CITIES.filter(c=>c.has));
      toast(`${byId[id]?.name||""}的资料整理好了`); if(selId===id) openCity(id,{stay:1}); return;
    }
    if(selId===id) rerender();
    if(r.status==="error"||r.status==="none") return;
  }
}
async function loadCity(id){
  if(DATA[id]!==undefined || !IDX[id]) return DATA[id];
  try{ DATA[id]=await getJSON(`data/city/${id}.json`); }catch(e){ DATA[id]=null; }
  return DATA[id];
}

// 历史三段 → 时间轴三个节点：标签取段落里第一个年代，标题取第一句
function eraOf(p){
  const m = p.match(/(公元前\s*\d{1,4}\s*年|前\s*\d{1,2}\s*世纪|\d{1,2}\s*世纪(?:初|末|中叶|后期|前期)?|\d{3,4}\s*年代|\d{3,4}\s*年)/);
  const first = (p.split(/(?<=[。！？])/)[0]||p).trim();
  const short = first.length>34;   // 第一句太长就截成标题，正文给全段；否则标题=第一句，正文接着往下
  return { y: m ? m[1].replace(/\s+/g,"") : "—", h: short ? first.slice(0,32)+"…" : first, rest: short ? p : p.slice(first.length).trim() || p };
}

    ${list.map(o=>`<button class="chip ${o.cid===cur?"on":""}" data-origin="${esc(o.cid)}">${esc(byId[o.cid].name)}${o.tag?`<i>${o.tag}</i>`:""}</button>`).join("")}

// 撕 = 进度 p 从上往下推：p 以上的纸桥断开，断口按每段穿孔随机错开（票身和存根互补），p 以下还是直的穿孔线；

function tkProfile(seed,h){

// 景点轮播：浏览器原生横向滚动 + 吸附（手指拖到哪跟到哪，松手带惯性），滚动时按离中线的距离连续调整大小/亮度/视差
function wireRail(card, rail, id, u){
  const cards=[...rail.children], n=cards.length, cnt=card.querySelector(".sh .cnt"), dots=[...card.querySelectorAll(".dots button")];
  const arrL=card.querySelector(".arr.l"), arrR=card.querySelector(".arr.r");
  const step=()=>cards[1] ? cards[1].offsetLeft-cards[0].offsetLeft : rail.clientWidth;
  const idx=()=>Math.max(0,Math.min(n-1,Math.round(rail.scrollLeft/step())));
  const goTo=(i,smooth=true)=>rail.scrollTo({left:Math.max(0,Math.min(n-1,i))*step(), behavior: smooth&&!reduced?"smooth":"auto"});
  let raf=0;
  const paint=()=>{ raf=0;
    const mid=rail.scrollLeft+rail.clientWidth/2, st=step();
    cards.forEach(el=>{
      const d=(el.offsetLeft+el.offsetWidth/2-mid)/st, a=Math.min(1,Math.abs(d));
      if(!reduced){
        el.style.transform=`scale(${1-.07*a})`;
        el.style.filter=`brightness(${1-.32*a})`;
        const im=el.querySelector("img"); if(im) im.style.transform=`translate3d(${(-d*28).toFixed(1)}px,0,0) scale(1.12)`;
      }
    });
    const k=idx(); if(k!==u.si){ u.si=k; }
    if(cnt) cnt.textContent=`${String(k+1).padStart(2,"0")} / ${String(n).padStart(2,"0")}`;
    dots.forEach((b,i)=>b.classList.toggle("on",i===k));
    arrL.hidden=k===0; arrR.hidden=k===n-1;
  };
  rail.addEventListener("scroll",()=>{ if(!raf) raf=requestAnimationFrame(paint); },{passive:true});
  addEventListener("resize",()=>{ if(rail.isConnected) goTo(u.si,false); });
  arrL.onclick=e=>{ e.stopPropagation(); goTo(idx()-1); };
  arrR.onclick=e=>{ e.stopPropagation(); goTo(idx()+1); };
  dots.forEach((b,i)=>b.onclick=()=>goTo(i));
  cards.forEach((el,i)=>el.onclick=()=>{ if(i!==idx()) return goTo(i); sightSheet(id,i,el); });
  requestAnimationFrame(()=>{ goTo(u.si,false); paint(); });   // 回到上次看到的那张（卡片重绘后也不跳回第一张）
}

// 手机上的卡片是真正的底部抽屉：在顶部往下拖 → 全屏先缩回半屏，半屏再往下拖就收起；往上拖 → 全屏
function sheetDrag(el, {onClose, half}){
  let y0=null, dy=0, drag=false;
  el.addEventListener("touchstart",e=>{ if(wide()||e.touches.length>1) return;
    if(el.scrollTop>0 && !e.target.closest(".grab")) return;   // 内容还没滚到顶时，手指是在滚内容
    y0=e.touches[0].clientY; dy=0; drag=false; },{passive:true});
  el.addEventListener("touchmove",e=>{ if(y0===null) return; dy=e.touches[0].clientY-y0;
    if(!drag){ if(Math.abs(dy)<8) return; if(dy<0 && el.scrollTop>0){ y0=null; return; } drag=true; el.style.transition="none"; }
    if(dy>0){ e.preventDefault(); el.style.transform=`translateY(${dy}px)`; } },{passive:false});
  el.addEventListener("touchend",()=>{ if(y0===null) return; y0=null; el.style.transition=""; el.style.transform="";
    if(!drag) return;
    if(dy>110){ if(half&&half.isFull()){ half.collapse(); } else onClose(); }
    else if(dy<-50 && half) half.expand(); });
}

const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
const STANDALONE = matchMedia("(display-mode: standalone)").matches || navigator.standalone===true;
const PUSH_OK = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window && window.isSecureContext;
let pushSub=null;
async function swReg(){ try{ return await navigator.serviceWorker.register("sw.js"); }catch(e){ return null; } }
async function initPush(){
  if(!SH()||!state.cfg.features?.push_web||!PUSH_OK()) return renderBell();
  const reg=await swReg(); try{ pushSub=reg&&await reg.pushManager.getSubscription(); }catch(e){ pushSub=null; }
  renderBell();
}
function renderBell(){
  const b=$("#bellbtn"); if(!b) return;
  b.hidden=!(SH() && state.cfg.features?.push_web && (PUSH_OK() || (IOS && !STANDALONE)));

}
const u8 = s => { const p="=".repeat((4-s.length%4)%4), b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(b,c=>c.charCodeAt(0)); };
function openBell(){
  const sh=$("#sheet"), P=esc(PT()); sh.hidden=false;
  const need=IOS&&!STANDALONE&&!PUSH_OK();
  sh.innerHTML=`<div class="shin ap ntf"><div class="aph"><b>通知</b><button class="x" aria-label="关闭">×</button></div>
    <p class="hint">${P}留言、递东西给你、点亮星星的时候，这台设备会响一下。</p>
    ${need?`<button class="pill solid" disabled>开启通知</button><p class="hint">iPhone / iPad：先在 Safari 里点「分享 → 添加到主屏幕」，从主屏幕打开经停，再回到这里开启。</p>`
      : pushSub?`<p class="hint">✓ 这台设备已经开启了。</p><button class="pill soft warn" data-off>关掉这台设备的通知</button>`
      : `<button class="pill solid" data-on>开启通知</button>${IOS?`<p class="hint">iPhone / iPad 要从主屏幕打开才收得到。</p>`:""}`}</div>`;

    try{
      if(await Notification.requestPermission()!=="granted") throw new Error("没有允许通知（可以在浏览器设置里改）");
      const reg=await swReg(); if(!reg) throw new Error("service worker 没注册上"); await navigator.serviceWorker.ready;
      const k=await getJSON("api/push/vapid"); if(!k.ok) throw new Error(k.reason||"服务器没开 Web Push");
      pushSub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:u8(k.publicKey)});
      await api("POST","push/web",{subscription:pushSub.toJSON()}); renderBell(); openBell(); toast("通知开启了");
    }catch(err){ toast("没开成："+err.message); b.disabled=false; } });
  sh.querySelector("[data-off]")?.addEventListener("click",async()=>{
    try{ const ep=pushSub.endpoint; await pushSub.unsubscribe(); pushSub=null; await api("DELETE","push/web",{endpoint:ep}); }catch(e){}

  const P=srch.places&&srch.places.q===q?srch.places:null;
  if(!P) return `<button class="sr addplace" data-findplace><span class="srn">找不到？在地图上加上「${esc(q)}」</span><span class="sre">去维基数据里找这个地方</span></button>`;
  if(P.loading) return `<p class="hint pl">正在维基数据里找「${esc(q)}」…</p>`;
  if(P.err) return `<p class="hint pl">${esc(P.err)}</p>`;
  if(!P.items.length) return `<p class="hint pl">维基数据里也没找到「${esc(q)}」。换个写法试试，比如加上「县」「镇」，或者用英文名。</p>`;
  return `<div class="sg2">在地图上加上哪一个？</div>`+P.items.map(it=> it.exists
    ? `<button class="sr" data-city="${esc(it.exists)}"><span class="srn">${esc(it.name)}</span><span class="sre">地图上已经有了：${esc(it.exists_name||"就在附近")}</span></button>`
    : `<button class="sr" data-qid="${esc(it.qid)}"><span class="srn">${esc(it.name)}</span><span class="sre">${esc([it.desc, czh(it.country)].filter(Boolean).join(" · "))}</span><span class="srh soft">加上</span></button>`).join("");
}
function renderSearch(){
  const el=$("#search"), q=srch.q.trim(), fq=fold(q);
  let body="";
  if(q){
    const hitC=CITIES.filter(c=>c.name.includes(q)||fold(c.en).includes(fq));
    hitC.sort((a,b)=>(b.has?1:0)-(a.has?1:0) || (a.name.startsWith(q)||fold(a.en).startsWith(fq)?0:1)-(b.name.startsWith(q)||fold(b.en).startsWith(fq)?0:1));
    const hitN=[...new Set(CITIES.map(c=>c.country))].filter(n=>n && (czh(n).includes(q)||fold(n).includes(fq)));
    body = (hitN.length?`<div class="sg2">国家</div>${hitN.slice(0,6).map(n=>`<button class="sr" data-country="${esc(n)}"><span class="srn">${esc(czh(n))}</span><span class="sre">${esc(n)}</span><span class="srh soft">${CITIES.filter(c=>c.country===n).length} 座 ›</span></button>`).join("")}`:"")
         + (hitC.length?`<div class="sg2">城市</div>${hitC.slice(0,40).map(cityRow).join("")}`:"")
         || `<p class="empty">没找到「${esc(q)}」。可以试试英文名，或者换个写法。</p>`;
    body += placeHTML(q);
  } else if(srch.country){
    const list=CITIES.filter(c=>c.country===srch.country).sort((a,b)=>(b.has?1:0)-(a.has?1:0)||a.name.localeCompare(b.name,"zh"));
    body=`<button class="lk back" data-back>‹ 所有国家</button><div class="sg2">${esc(czh(srch.country))} · ${list.length} 座</div>${list.map(cityRow).join("")}`;
  } else if(srch.tab==="been"){   // 去过的：按国家分组（手机上看不到电脑端的航段栏）
    const cnt={}; state.ck.forEach(x=>{ if(byId[x.city]) cnt[x.city]=(cnt[x.city]||0)+1; });
    const g={}; Object.keys(cnt).forEach(id=>(g[byId[id].country||""]=g[byId[id].country||""]||[]).push(id));
    const gs=Object.keys(g).sort((a,b)=>g[b].length-g[a].length);
    body = gs.length ? `<div class="sg2">来过 ${Object.keys(cnt).length} 座城 · ${state.ck.length} 次</div>`+gs.map(n=>`<div class="sg3">${esc(czh(n))} <i>${g[n].length}</i></div><div class="cityrow">${g[n].map(id=>`<button class="chip" data-city="${esc(id)}">${esc(byId[id].name)}${cnt[id]>1?`<i>${cnt[id]} 次</i>`:""}</button>`).join("")}</div>`).join("")
      : `<p class="empty">还没打过卡。点开一座城，在「我的经停」里点「来过」。</p>`;
  } else if(srch.tab==="wish"){   // 想去的：两个人的星星
    const by={}; (state.wish||[]).forEach(w=>{ if(byId[w.id]) (by[w.id]=by[w.id]||{})[w.by]=w.note; });
    const grp=[["都想去",id=>Object.keys(by[id]).length===2],[NAME("me")+"想去",id=>Object.keys(by[id]).join()==="me"],[NAME("partner")+"想去",id=>Object.keys(by[id]).join()==="partner"]];
    body = Object.keys(by).length ? grp.map(([t,f])=>{ const ids=Object.keys(by).filter(f); return ids.length?`<div class="sg3">${t} <i>${ids.length}</i></div>${ids.map(id=>`<button class="sr" data-city="${esc(id)}"><span class="srn">${esc(byId[id].name)}</span><span class="sre">${esc(Object.values(by[id]).filter(Boolean).join(" / "))}</span></button>`).join("")}`:""; }).join("")
      : `<p class="empty">还没有星星。点开一座城，在「想去」里点亮。</p>`;
  } else {
    const cnt={}; for(const c of CITIES){ if(c.country) (cnt[c.country]=cnt[c.country]||{n:0,h:0}), cnt[c.country].n++, c.has&&cnt[c.country].h++; }
    const ns=Object.keys(cnt).sort((a,b)=>cnt[b].h-cnt[a].h||cnt[b].n-cnt[a].n);
    body=`<div class="sg2">按国家找 · ${ns.length} 个国家</div><div class="cgrid">${ns.map(n=>`<button class="cc" data-country="${esc(n)}"><b>${esc(czh(n))}</b><i>${cnt[n].h?cnt[n].h+" 座有资料":cnt[n].n+" 座"}</i></button>`).join("")}</div>`;
  }
  el.innerHTML=`<div class="shin srch"><div class="sbar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m15 15 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <label for="sq" class="vh-only">搜索城市或国家</label><input id="sq" type="search" value="${esc(srch.q)}" placeholder="${srch.pick?`搜城市，比如 ${esc(byId[defOriginOf(srch.pick.city)]?.name||"巴黎")}`:"搜城市或国家，中文英文都行"}" autocomplete="off" enterkeyhint="search">
      <button class="x" aria-label="关闭搜索">×</button></div>${!q&&!srch.country?`<div class="stabs" role="tablist">${[["",`按国家找`],["been",`去过的`],["wish",`想去的`]].map(([k,t])=>`<button role="tab" aria-selected="${(srch.tab||"")===k}" class="${(srch.tab||"")===k?"on":""}" data-tab="${k}">${t}</button>`).join("")}</div>`:""}${srch.pick&&byId[srch.pick.city]?`<p class="sg2 pickhint">${srch.pick.field==="dest"?`选终点 · 从${esc(byId[srch.pick.city].name)}回到哪儿`:`选出发地 · 去${esc(byId[srch.pick.city].name)}`}</p>`:""}<div class="sres">${body}</div></div>`;
  const inp=el.querySelector("input");
  inp.oninput=()=>{ srch.q=inp.value; srch.country=null; const pos=inp.selectionStart; renderSearch(); const i2=$("#search input"); i2.focus(); i2.setSelectionRange(pos,pos); };
  inp.onkeydown=e=>{ if(e.key==="Enter"){ const first=el.querySelector("[data-city]"); first&&first.click(); } };
  el.querySelector(".x").onclick=closeSearch;
  el.onclick=e=>{ if(e.target===el) closeSearch(); };
  el.querySelector("[data-back]")?.addEventListener("click",()=>{ srch.country=null; renderSearch(); });
  el.querySelector("[data-findplace]")?.addEventListener("click",async()=>{ const q0=srch.q.trim(); srch.places={q:q0,loading:true}; renderSearch();
    try{ const r=await getJSON("api/place/search?q="+encodeURIComponent(q0)); srch.places={q:q0,items:r.items||[]}; }
    catch(e){ srch.places={q:q0,err:"维基数据没连上，过一会儿再试"}; } if(!$("#search").hidden) renderSearch(); });
  el.querySelectorAll("[data-qid]").forEach(b=>b.onclick=async()=>{ b.disabled=true;
    try{ const r=await api("POST","place",{qid:b.dataset.qid}); const [name,en,lat,lng,country]=r.city;
      if(!byId[r.id]){ const c={id:r.id,name,en,lat,lng,country}; CITIES.push(c); byId[r.id]=c; }
      const to=srch.pick; srch.places=null; closeSearch(); toast(`「${name}」加到地图上了`);
      if(to) return to.field==="dest" ? setDest(to.city,r.id,to.trip) : setOrigin(to.city,r.id,to.trip);
      if(selId) selId=null; openCity(r.id);
    }catch(e){ toast("没加上："+e.message); b.disabled=false; } });
  el.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ srch.tab=b.dataset.tab; renderSearch(); el.querySelector(".sres").scrollTop=0; });
  el.querySelectorAll("[data-country]").forEach(b=>b.onclick=()=>{ srch.country=b.dataset.country; srch.q=""; renderSearch(); el.querySelector(".sres").scrollTop=0; });
  el.querySelectorAll("[data-city]").forEach(b=>b.onclick=()=>{ const to=srch.pick; closeSearch(); if(to) return to.field==="dest" ? setDest(to.city,b.dataset.city,to.trip) : setOrigin(to.city,b.dataset.city,to.trip); if(selId) selId=null; openCity(b.dataset.city); });
}

let tt; function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2400)}

document.querySelectorAll("#styles button").forEach(b=>b.onclick=()=>{ if(b.dataset.s!==current) build(b.dataset.s); });

$("#srchbtn").onclick=openSearch;
$("#chatbtn").onclick=openChat;
$("#bellbtn").onclick=openBell;
$("#dice").onclick=()=>{ const p=$("#dicepop"); p.hidden=!p.hidden; };
document.querySelectorAll("#dicepop [data-scope]").forEach(b=>b.onclick=()=>rollDice(b.dataset.scope));

// 电脑上捏合触控板或 Ctrl+滚轮，浏览器默认会把整页放大（卡片撑爆、地球糊成一片海）。拦下来只缩放地球
function zoomGlobe(f){ if(!world) return; const p=world.pointOfView(); world.pointOfView({lat:p.lat,lng:p.lng,altitude:Math.max(STYLES[current]?.minAlt??.05,Math.min(6,p.altitude*f))}); }
const inUI=t=>t?.closest?.(".card,.layer,.top,.side");
addEventListener("wheel",e=>{ if(!e.ctrlKey) return; e.preventDefault(); if(!inUI(e.target)) zoomGlobe(Math.exp(Math.max(-50,Math.min(50,e.deltaY))*.004)); },{passive:false});
let _gs=1;   // Mac Safari 的捏合走 gesture 事件
addEventListener("gesturestart",e=>{ e.preventDefault(); _gs=e.scale||1; });
addEventListener("gesturechange",e=>{ e.preventDefault(); if(!inUI(e.target)&&e.scale) zoomGlobe(_gs/e.scale); _gs=e.scale; });
addEventListener("gestureend",e=>e.preventDefault());
addEventListener("resize",()=>{ world&&world.width(innerWidth).height(innerHeight); if(selId){document.body.classList.toggle("open-side",wide());document.body.classList.toggle("open-sheet",!wide());} });
addEventListener("keydown",e=>{ if(e.key!=="Escape") return; const open=[...document.querySelectorAll(".layer")].reverse().find(x=>!x.hidden); if(open){ open.querySelector(".x")?.click(); if(!open.hidden) open.hidden=true; return; } if(selId) closeCard(); });   // Esc 先关最上面那层

(async()=>{
  // 城市表：有资料的城市 + 能点但还没资料的 Natural Earth 城市
  try{
    const d=await getJSON("data/cities.json");
    for(const x of d.cities){ const c={id:x.id,name:x.n,en:x.e,country:x.c,lat:x.la,lng:x.lo,has:1}; CITIES.push(c); byId[c.id]=c; IDX[c.id]=x; }
    COUNTRY_ZH=d.cz||{};
    for(const [name,en,lat,lng,country] of d.extra){ const c={id:"n_"+en+"_"+lat,name,en,lat,lng,country}; CITIES.push(c); byId[c.id]=c; }
  }catch(e){ toast("城市表没加载上，刷新一下试试"); }
  try{ await loadState(); }catch(e){ toast("打卡记录没加载上，刷新一下试试"); }
  renderSide();
  let start="marble"; try{start=localStorage.getItem("jt-style2")||"marble"}catch(e){}
  if(!STYLES[start]) start="marble";
  if(typeof Globe==="undefined"){ $("#globe").innerHTML='<p style="padding:120px 16px;color:var(--muted)">地球库没加载上，刷新一下试试。</p>'; return; }
  await build(start);
  initPush();
  // 深链：?city=<id> 或 #city=<id>（推送、聊天卡片点进来）
  const q=new URLSearchParams(location.search).get("city") || new URLSearchParams(location.hash.slice(1)).get("city");
  if(q && byId[q]){ await loadCity(q); openCity(q); }
})();
</script>
